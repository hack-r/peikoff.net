name: fix-double-peikoff
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fix doubled Peikoff
        run: |
          FILES=$(grep -rl 'Barbara Branden Peikoff Peikoff' --include='*.json' --include='*.js' --include='*.py' --include='*.R' --include='*.md' --include='*.html' . || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs sed -i 's/Barbara Branden Peikoff Peikoff/Barbara Branden Peikoff/g'
            git config user.name "Ason"
            git config user.email "hack-r@users.noreply.github.com"
            git add -A
            git commit -m 'Fix doubled Peikoff after rename'
            git push
          fi
