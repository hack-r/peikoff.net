<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peikoff.net Shell</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230c2a4a'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='36'%3E%F0%9F%85%BF%EF%B8%8F%3C/text%3E%3C/svg%3E"
      type="image/svg+xml"
    />
    <link
      rel="shortcut icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230c2a4a'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='36'%3E%F0%9F%85%BF%EF%B8%8F%3C/text%3E%3C/svg%3E"
      type="image/svg+xml"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;500&display=swap"
      rel="stylesheet"
    />
    <style>
      .footer-links {
        position: fixed;
        bottom: 2px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 6px;
        font-size: 3px;
        line-height: 1;
      }

      .footer-links a {
        color: transparent;
        text-decoration: none;
      }

      .build-meta {
        position: fixed;
        left: 8px;
        bottom: 8px;
        font-size: 9px;
        line-height: 1.2;
        letter-spacing: 0.02em;
        color: rgba(232, 238, 249, 0.34);
        text-shadow: 0 0 1px rgba(0, 0, 0, 0.35);
        pointer-events: none;
        user-select: none;
      }

      .build-meta .label {
        display: block;
      }

      :root {
        --button-close: rgb(255, 97, 89);
        --button-minimize: rgb(255, 191, 47);
        --button-maximize: rgb(37, 204, 62);
        --window-border: rgb(179, 179, 179);
        --terminal-bg: rgba(8, 11, 17, 0.9);
        --prompt: rgb(189, 227, 113);
        --path: rgb(94, 215, 255);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background:
          radial-gradient(circle at 20% 10%, #00d2ff 0%, transparent 30%),
          radial-gradient(circle at 80% 90%, #3a7bd5 0%, transparent 35%),
          linear-gradient(140deg, #1f3b66 0%, #2e68b7 52%, #4aa0ff 100%);
        font-family: "Source Code Pro", monospace;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .window {
        width: min(920px, 100%);
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--window-border);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
        animation: bounceIn 0.9s ease-in-out;
      }

      .handle {
        height: 34px;
        background: linear-gradient(0deg, rgb(216, 216, 216), rgb(236, 236, 236));
        border-top: 1px solid white;
        border-bottom: 1px solid var(--window-border);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(0, 0, 0, 0.7);
        font-size: 13px;
      }

      .buttons {
        position: absolute;
        left: 10px;
        display: flex;
        gap: 8px;
      }

      .window-button {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.2);
      }

      .window-button.close {
        background: var(--button-close);
      }

      .window-button.minimize {
        background: var(--button-minimize);
      }

      .window-button.maximize {
        background: var(--button-maximize);
      }

      .terminal {
        background: var(--terminal-bg);
        color: #e8eef9;
        min-height: 320px;
        max-height: 56vh;
        overflow: auto;
        padding: 12px;
        font-size: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .line {
        margin: 0;
      }

      .prompt {
        color: var(--prompt);
      }

      .path {
        color: var(--path);
      }

      .input-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }

      #cmd {
        flex: 1;
        background: transparent;
        color: #f5f8ff;
        border: 1px solid rgba(180, 200, 255, 0.4);
        border-radius: 6px;
        font: inherit;
        padding: 8px 10px;
      }

      #cmd:focus {
        border-color: rgba(180, 220, 255, 0.9);
      }

      .table-tools {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        color: #d8e8ff;
        font-size: 12px;
      }

      .table-tools label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .table-tools select,
      .table-tools button {
        background: rgba(14, 31, 53, 0.9);
        color: #e8f2ff;
        border: 1px solid rgba(133, 169, 255, 0.45);
        border-radius: 6px;
        font: inherit;
        padding: 4px 8px;
      }

      .table-tools button[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .pager-info {
        min-width: 90px;
        color: #b3cdf7;
      }

      .table-wrap {
        margin-top: 16px;
        background: rgba(6, 10, 16, 0.8);
        border: 1px solid rgba(133, 169, 255, 0.45);
        border-radius: 8px;
        overflow-x: auto;
        overflow-y: auto;
        color: #e8eef9;
      }

      table {
        width: max-content;
        min-width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        table-layout: fixed;
      }

      th,
      td {
        border-bottom: 1px solid rgba(131, 151, 206, 0.25);
        border-right: 1px solid rgba(131, 151, 206, 0.15);
        padding: 10px;
        text-align: left;
        vertical-align: middle;
        height: 44px;
        min-height: 44px;
        max-height: 44px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      th {
        color: #d5f1ff;
        background: rgba(59, 104, 184, 0.5);
        position: sticky;
        top: 0;
        font-weight: 500;
        position: sticky;
      }

      th .th-label {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        padding-right: 12px;
      }

      .col-resizer {
        position: absolute;
        top: 0;
        right: 0;
        width: 8px;
        height: 100%;
        cursor: col-resize;
      }

      .col-resizer::after {
        content: "";
        position: absolute;
        top: 8px;
        bottom: 8px;
        right: 3px;
        width: 2px;
        background: rgba(160, 205, 255, 0.45);
      }

      .col-resizer:hover::after {
        background: rgba(160, 205, 255, 0.9);
      }

      td {
        color: #f0f6ff;
        background: rgba(12, 23, 40, 0.55);
      }

      tbody tr:nth-child(even) td {
        background: rgba(16, 29, 48, 0.7);
      }

      @media (max-width: 700px) {
        body {
          padding: 10px;
        }

        .terminal {
          min-height: 240px;
        }
      }

      @keyframes bounceIn {
        0% {
          transform: translateY(-600px);
          opacity: 0;
        }
        60% {
          transform: translateY(30px);
          opacity: 1;
        }
        100% {
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="window" aria-label="D1 terminal">
      <div class="handle">
        <div class="buttons" aria-hidden="true">
          <span class="window-button close"></span>
          <span class="window-button minimize"></span>
          <span class="window-button maximize"></span>
        </div>
        <span>1. ason@peikoff.net: ~ (zsh)</span>
      </div>

      <section class="terminal" id="terminal" aria-live="polite"></section>

      <div class="input-row">
        <label for="cmd" class="prompt">$</label>
        <input
          id="cmd"
          name="cmd"
          type="text"
          autocomplete="off"
          spellcheck="false"
           placeholder="Try /whois or /random"
          aria-label="Terminal command"
        />
      </div>

      <section class="table-wrap" id="tableWrap" hidden>
        <table id="resultTable"></table>
      </section>

      <section class="table-tools" id="tableTools" hidden>
        <label>
          <input id="paginationToggle" type="checkbox" />
          Pagination
        </label>
        <label>
          Page size
          <select id="pageSize">
            <option value="10">10</option>
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
        <button id="prevPage" type="button">Prev</button>
        <button id="nextPage" type="button">Next</button>
        <span class="pager-info" id="pageIndicator">All rows</span>
        <button id="downloadCsv" type="button">Download CSV</button>
      </section>
    </main>

    <aside class="build-meta" aria-hidden="true">
      <span class="label" id="buildCommit">c loading</span>
      <span class="label" id="buildTime">t loading</span>
    </aside>
    <nav class="footer-links" aria-label="Footer links">
      <a href="https://aikoresh.com">aikoresh.com</a>
      <a href="https://asonpeikoff.com">asonpeikoff.com</a>
      <a href="https://aynrandusa.org">aynrandusa.org</a>
      <a href="https://c-forum.com">c-forum.com</a>
      <a href="https://dominiquechat.com">dominiquechat.com</a>
      <a href="https://integritypharms.com">integritypharms.com</a>
      <a href="https://levineconsulting.co">levineconsulting.co</a>
      <a href="https://mycityforum.com">mycityforum.com</a>
      <a href="https://nooiq.co">nooiq.co</a>
      <a href="https://posocap.com">posocap.com</a>
      <a href="https://shomrimrangers.com">shomrimrangers.com</a>
      <a href="https://threatlevelup.com">threatlevelup.com</a>
      <a href="https://whoneeds.it">whoneeds.it</a>
    </nav>

    <script>
      const terminal = document.getElementById("terminal");
      const cmdInput = document.getElementById("cmd");
      const tableTools = document.getElementById("tableTools");
      const tableWrap = document.getElementById("tableWrap");
      const resultTable = document.getElementById("resultTable");
      const paginationToggle = document.getElementById("paginationToggle");
      const pageSizeSelect = document.getElementById("pageSize");
      const prevPageButton = document.getElementById("prevPage");
      const nextPageButton = document.getElementById("nextPage");
      const pageIndicator = document.getElementById("pageIndicator");
      const downloadCsvButton = document.getElementById("downloadCsv");
      const buildCommit = document.getElementById("buildCommit");
      const buildTime = document.getElementById("buildTime");

      const state = {
        unlocked: false,
        password: "",
        awaitingPassword: false,
        pendingSql: "",
        columnWidths: {},
        columns: [],
        rows: [],
        page: 1,
        pageSize: 25,
        paginationEnabled: false,
      };

      const DEFAULT_COLUMN_WIDTH = 180;
      const MIN_COLUMN_WIDTH = 140;
      const ID_FIRST_COLUMN_DEFAULT_WIDTH = 58;
      const ID_FIRST_COLUMN_MIN_WIDTH = 16;
      const PUBLIC_RANDOM_LINKS = [
        { label: "Leonard Peikoff's homepage", href: "https://peikoff.com" },
        { label: "Ason Peikoff's homepage", href: "https://asonpeikoff.com" },
        { label: "Kira Peikoff's homepage", href: "https://kirapeikoff.com" },
        { label: "Barbara Branden Peikoff's homepage", href: "https://barbarabranden.com" },
        { label: "Amy Peikoff's 'Don't Let It Go'", href: "https://dontletitgo.com" },
        {
          label: "Amy Peikoff's 'Legalizing Privacy'",
          href: "https://legalizingprivacy.substack.com",
        },
      ];

      function print(text) {
        const line = document.createElement("p");
        line.className = "line";
        line.textContent = text;
        terminal.appendChild(line);
        terminal.scrollTop = terminal.scrollHeight;
      }

      function printPrompt() {
        print("$ ~ ");
      }

      function setInputMode(mode) {
        cmdInput.type = mode;
      }

      function printLink(label, href) {
        const line = document.createElement("p");
        line.className = "line";
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.target = "_blank";
        anchor.rel = "noreferrer noopener";
        anchor.textContent = label;
        line.appendChild(anchor);
        terminal.appendChild(line);
        terminal.scrollTop = terminal.scrollHeight;
      }

      function handlePublicSlashCommand(input) {
        const lower = input.toLowerCase();

        if (lower === "/whois") {
          print("This site was created by Ason Peikoff (asonpeikoff.com).");
          return true;
        }

        if (lower === "/whoare") {
          print("The Peikoffs are a group of unprecedently attractive and intelligent individualists, currently headed by the philosopher Leonard S. Peikoff.");
          return true;
        }
        if (lower === "/random") {
          const randomIndex = Math.floor(Math.random() * PUBLIC_RANDOM_LINKS.length);
          const randomLink = PUBLIC_RANDOM_LINKS[randomIndex];
          print("Random peikoff: " + randomLink.label);
          printLink(randomLink.label, randomLink.href);
          window.location.assign(randomLink.href);
          return true;
        }

        if (lower === "/data") {
          if (state.unlocked) {
            print("D1 query mode is already unlocked.");
            return true;
          }

          state.awaitingPassword = true;
          state.pendingSql = "";
          setInputMode("password");
          print("Enter password to unlock D1 query mode.");
          return true;
        }

        return false;
      }

      function isFirstIdColumn(columnName, index) {
        return index === 0 && String(columnName).trim().toLowerCase() === "id";
      }

      function getWidthKey(columnName, index) {
        return index + ":" + columnName;
      }

      function getDefaultWidth(columnName, index) {
        return isFirstIdColumn(columnName, index)
          ? ID_FIRST_COLUMN_DEFAULT_WIDTH
          : DEFAULT_COLUMN_WIDTH;
      }

      function getMinWidth(columnName, index) {
        return isFirstIdColumn(columnName, index)
          ? ID_FIRST_COLUMN_MIN_WIDTH
          : MIN_COLUMN_WIDTH;
      }

      function getVisibleRows() {
        if (!state.paginationEnabled) {
          return state.rows;
        }

        const start = (state.page - 1) * state.pageSize;
        return state.rows.slice(start, start + state.pageSize);
      }

      function getPageCount() {
        if (!state.paginationEnabled) {
          return 1;
        }

        return Math.max(1, Math.ceil(state.rows.length / state.pageSize));
      }

      function updateTableTools() {
        const hasData = state.columns.length > 0;
        tableTools.hidden = !hasData;
        if (!hasData) {
          return;
        }

        const pageCount = getPageCount();
        pageIndicator.textContent = state.paginationEnabled
          ? "Page " + state.page + " / " + pageCount
          : "All rows";

        pageSizeSelect.disabled = !state.paginationEnabled;
        prevPageButton.disabled = !state.paginationEnabled || state.page <= 1;
        nextPageButton.disabled = !state.paginationEnabled || state.page >= pageCount;
      }

      function renderTable() {
        const columns = state.columns;
        const rows = getVisibleRows();
        if (!columns.length) {
          tableTools.hidden = true;
          tableWrap.hidden = true;
          resultTable.innerHTML = "";
          return;
        }

        const colgroup = document.createElement("colgroup");
        const cols = [];
        for (let index = 0; index < columns.length; index += 1) {
          const column = columns[index];
          const widthKey = getWidthKey(column, index);
          const col = document.createElement("col");
          const width = Math.max(
            getMinWidth(column, index),
            Number(state.columnWidths[widthKey] || getDefaultWidth(column, index)),
          );
          col.style.width = width + "px";
          colgroup.appendChild(col);
          cols.push(col);
        }

        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        for (let index = 0; index < columns.length; index += 1) {
          const column = columns[index];
          const th = document.createElement("th");
          const label = document.createElement("span");
          label.className = "th-label";
          label.textContent = column;
          th.appendChild(label);

          const resizer = document.createElement("span");
          resizer.className = "col-resizer";
          resizer.setAttribute("aria-hidden", "true");
          attachColumnResize(resizer, cols[index], column, index);
          th.appendChild(resizer);

          headRow.appendChild(th);
        }
        thead.appendChild(headRow);

        const tbody = document.createElement("tbody");
        for (const row of rows) {
          const tr = document.createElement("tr");
          for (const column of columns) {
            const td = document.createElement("td");
            const value = row[column];
            td.textContent = value == null ? "NULL" : String(value);
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }

        resultTable.innerHTML = "";
        resultTable.appendChild(colgroup);
        resultTable.appendChild(thead);
        resultTable.appendChild(tbody);
        tableWrap.hidden = false;
        updateTableTools();
      }

      function attachColumnResize(handle, col, columnName, index) {
        handle.addEventListener("mousedown", (event) => {
          event.preventDefault();

          const startX = event.clientX;
          const startWidth = parseInt(col.style.width, 10) || DEFAULT_COLUMN_WIDTH;
          const minWidth = getMinWidth(columnName, index);
          const widthKey = getWidthKey(columnName, index);

          function onMouseMove(moveEvent) {
            const delta = moveEvent.clientX - startX;
            const width = Math.max(minWidth, startWidth + delta);
            col.style.width = width + "px";
            state.columnWidths[widthKey] = width;
          }

          function onMouseUp() {
            document.removeEventListener("mousemove", onMouseMove);
            document.removeEventListener("mouseup", onMouseUp);
          }

          document.addEventListener("mousemove", onMouseMove);
          document.addEventListener("mouseup", onMouseUp);
        });
      }

      function toCsv(columns, rows) {
        const escape = (value) => {
          if (value == null) {
            return "";
          }

          const text = String(value);
          if (/[",\n]/.test(text)) {
            return '"' + text.replace(/"/g, '""') + '"';
          }

          return text;
        };

        const lines = [];
        lines.push(columns.map(escape).join(","));
        for (const row of rows) {
          lines.push(columns.map((column) => escape(row[column])).join(","));
        }
        return lines.join("\n");
      }

      function downloadCsv() {
        if (!state.columns.length) {
          return;
        }

        const csv = toCsv(state.columns, state.rows);
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const stamp = new Date().toISOString().replace(/[:.]/g, "-");
        a.href = url;
        a.download = "d1-query-" + stamp + ".csv";
        a.click();
        URL.revokeObjectURL(url);
      }

      async function verifyPassword(password) {
        const response = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });

        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.error || "Password check failed.");
        }
      }

      async function runQuery(sql) {
        const response = await fetch("/api/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: state.password, sql }),
        });

        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(body.error || "Query failed.");
        }

        return body;
      }

      async function loadVersion() {
        try {
          const response = await fetch("/version.json", { cache: "no-store" });
          if (!response.ok) {
            throw new Error("version request failed");
          }

          const body = await response.json();
          const commit = String(body.commit || "dev");
          const shortCommit = commit === "unknown" ? commit : commit.slice(0, 7);
          buildCommit.textContent = "c " + shortCommit;
          buildTime.textContent = "t " + new Date().toISOString();
        } catch {
          buildCommit.textContent = "c unavailable";
          buildTime.textContent = "t unavailable";
        }
      }

      function bootstrap() {
        print("Peikoff.net");
        print("Public commands: /whois, /whoare, /random, /data");
        print("Type a public command or /data to unlock D1.");
        print("");
        const date = new Date().toString();
        print("Last login: " + date + " on ttys000");
        setInputMode("text");
        printPrompt();
        cmdInput.focus();
        loadVersion();
      }

      cmdInput.addEventListener("keydown", async (event) => {
        if (event.key !== "Enter") {
          return;
        }

        const raw = cmdInput.value;
        const input = raw.trim();
        cmdInput.value = "";

        if (!input) {
          printPrompt();
          return;
        }

        if (state.awaitingPassword) {
          print("$ ~ " + "*".repeat(input.length));
          try {
            await verifyPassword(input);
            state.unlocked = true;
            state.password = input;
            state.awaitingPassword = false;
            setInputMode("text");
            print("Access granted. You can now run SQLite SELECT statements.");

            const pendingSql = state.pendingSql;
            state.pendingSql = "";
            if (pendingSql) {
              try {
                const result = await runQuery(pendingSql);
                print("Query OK. " + result.rowCount + " row(s).");
                state.columns = result.columns || [];
                state.rows = result.rows || [];
                state.page = 1;
                renderTable();
              } catch (error) {
                print("Error: " + error.message);
              }
            }
          } catch (error) {
            state.awaitingPassword = false;
            state.pendingSql = "";
            setInputMode("text");
            print("Access denied: " + error.message);
          }

          printPrompt();
          return;
        }

        if (!state.unlocked && input.startsWith("/")) {
          if (handlePublicSlashCommand(input)) {
            printPrompt();
            return;
          }

          print("Unknown public command: " + input);
          printPrompt();
          return;
        }

        if (!state.unlocked) {
          state.awaitingPassword = true;
          state.pendingSql = input;
          setInputMode("password");
          print("Enter password to unlock D1 query mode.");
          printPrompt();
          return;
        } else {
          print("$ ~ " + input);
        }

        if (input.toLowerCase() === "clear") {
          terminal.innerHTML = "";
          state.columns = [];
          state.rows = [];
          state.page = 1;
          tableWrap.hidden = true;
          tableTools.hidden = true;
          resultTable.innerHTML = "";
          printPrompt();
          return;
        }

        try {
          const result = await runQuery(input);
          print("Query OK. " + result.rowCount + " row(s).");
          state.columns = result.columns || [];
          state.rows = result.rows || [];
          state.page = 1;
          renderTable();
        } catch (error) {
          print("Error: " + error.message);
        }

        printPrompt();
      });

      paginationToggle.addEventListener("change", () => {
        state.paginationEnabled = paginationToggle.checked;
        state.page = 1;
        renderTable();
      });

      pageSizeSelect.addEventListener("change", () => {
        const parsed = Number(pageSizeSelect.value);
        state.pageSize = Number.isFinite(parsed) && parsed > 0 ? parsed : 25;
        state.page = 1;
        renderTable();
      });

      prevPageButton.addEventListener("click", () => {
        if (state.page > 1) {
          state.page -= 1;
          renderTable();
        }
      });

      nextPageButton.addEventListener("click", () => {
        const pageCount = getPageCount();
        if (state.page < pageCount) {
          state.page += 1;
          renderTable();
        }
      });

      downloadCsvButton.addEventListener("click", downloadCsv);

      bootstrap();
    </script>

  </body>
</html>
