    <style>

      .build-meta {
        position: fixed;
        left: 8px;
        bottom: 8px;
        font-size: 9px;
        line-height: 1.2;
        letter-spacing: 0.02em;
        color: var(--page-ink);
        opacity: 0.6;
                pointer-events: none;
        user-select: none;
      }

      .build-meta .label {
        display: block;
      }

      :root {
        /* Warm dusk palette: charcoal-plum surfaces, amber as the accent, sage for the prompt. No blue, no red. */
        --button-close: rgb(232, 160, 74);
        --button-minimize: rgb(240, 208, 106);
        --button-maximize: rgb(139, 190, 120);
        --window-border: rgb(179, 170, 160);
        --terminal-bg: rgba(22, 17, 20, 0.93);
        --prompt: rgb(168, 207, 122);
        --path: rgb(255, 196, 107);
        --text: #f3ebe0;
        --text-dim: #cdbfae;
        --visited: #d7b6e6;
        --accent: #ffc46b;
        --accent-rgb: 255, 196, 107;
        --accent-hi: #ffd28a;
        --accent-lo: #f0a24e;
        --on-accent: #2a1608;
        --accent-line: rgba(var(--accent-rgb), 0.45);
        --surface: rgba(40, 30, 30, 0.9);
        --th-bg: rgba(150, 92, 52, 0.55);
        --th-text: #ffe7c2;
        --table-bg: rgba(14, 10, 12, 0.85);
        --cell-a: rgba(30, 22, 24, 0.55);
        --cell-b: rgba(42, 30, 30, 0.7);
        --glow-a: rgba(232, 140, 70, 0.55);
        --glow-b: rgba(150, 84, 118, 0.5);
        --bg-1: #2a1d28;
        --bg-2: #4a2f3a;
        --bg-3: #7a4a3a;
        --page-ink: #f3ebe0; /* text drawn straight on the page background */
      }

      /* Palettes: a random one on each visit, switchable from the swatch menu in the title bar (or ?theme=name).
         The unnamed :root above is dusk; forest-light and olive-light reuse their dark twin and only lighten the page background. */
      :root[data-theme="forest"],
      :root[data-theme="forest-light"] {
        --terminal-bg: rgba(12, 22, 17, 0.93); --prompt: rgb(150, 214, 150); --path: rgb(230, 195, 106);
        --text: #eef1e4; --text-dim: #bcc7b3; --visited: #d9c8a0;
        --accent: #e6c36a; --accent-rgb: 230, 195, 106; --accent-hi: #f3d98e; --accent-lo: #c9a043; --on-accent: #1d1a08;
        --surface: rgba(26, 40, 32, 0.9); --th-bg: rgba(78, 112, 70, 0.6); --th-text: #f1f0c8;
        --table-bg: rgba(8, 16, 11, 0.85); --cell-a: rgba(18, 30, 23, 0.55); --cell-b: rgba(28, 44, 34, 0.7);
        --glow-a: rgba(201, 160, 67, 0.45); --glow-b: rgba(60, 130, 90, 0.5);
        --bg-1: #10241c; --bg-2: #214636; --bg-3: #4a6a3c;
      }
      :root[data-theme="olive"],
      :root[data-theme="olive-light"] {
        --terminal-bg: rgba(22, 21, 12, 0.93); --prompt: rgb(205, 226, 110); --path: rgb(222, 190, 100);
        --text: #f1eedb; --text-dim: #c7c3a4; --visited: #e0c0c8;
        --accent: #d6e36a; --accent-rgb: 214, 227, 106; --accent-hi: #e6f08e; --accent-lo: #b3c43c; --on-accent: #1c2006;
        --surface: rgba(40, 38, 22, 0.9); --th-bg: rgba(116, 120, 44, 0.6); --th-text: #f4f6c8;
        --table-bg: rgba(16, 15, 8, 0.85); --cell-a: rgba(30, 29, 16, 0.55); --cell-b: rgba(44, 42, 24, 0.7);
        --glow-a: rgba(190, 170, 60, 0.5); --glow-b: rgba(120, 150, 60, 0.45);
        --bg-1: #26220f; --bg-2: #4d4a22; --bg-3: #7a6a30;
      }
      :root[data-theme="plum"] {
        --terminal-bg: rgba(24, 14, 22, 0.93); --prompt: rgb(240, 190, 150); --path: rgb(248, 184, 150);
        --text: #f6e9ee; --text-dim: #d2bcc6; --visited: #e8c0d8;
        --accent: #f6b49a; --accent-rgb: 246, 180, 154; --accent-hi: #ffd0b8; --accent-lo: #e48f78; --on-accent: #2e1018;
        --surface: rgba(44, 26, 40, 0.9); --th-bg: rgba(140, 62, 100, 0.55); --th-text: #ffe3ee;
        --table-bg: rgba(18, 9, 16, 0.85); --cell-a: rgba(34, 18, 30, 0.55); --cell-b: rgba(48, 26, 44, 0.7);
        --glow-a: rgba(228, 143, 120, 0.45); --glow-b: rgba(160, 60, 130, 0.5);
        --bg-1: #2b1426; --bg-2: #55264a; --bg-3: #7a3a5a;
      }
      :root[data-theme="graphite"] {
        --terminal-bg: rgba(16, 18, 17, 0.94); --prompt: rgb(127, 224, 176); --path: rgb(127, 224, 176);
        --text: #e9efec; --text-dim: #b4beb9; --visited: #d0c0a8;
        --accent: #7fe0b0; --accent-rgb: 127, 224, 176; --accent-hi: #a6f0c8; --accent-lo: #4fc088; --on-accent: #07210f;
        --surface: rgba(30, 36, 33, 0.9); --th-bg: rgba(70, 100, 86, 0.6); --th-text: #d8fbe8;
        --table-bg: rgba(10, 12, 11, 0.85); --cell-a: rgba(22, 26, 24, 0.55); --cell-b: rgba(32, 38, 35, 0.7);
        --glow-a: rgba(110, 170, 140, 0.35); --glow-b: rgba(150, 150, 120, 0.3);
        --bg-1: #1a1d1c; --bg-2: #2c3331; --bg-3: #454a3e;
      }
      :root[data-theme="forest-light"] {
        --page-ink: #14201a;
        --glow-a: rgba(240, 225, 150, 0.55); --glow-b: rgba(90, 170, 130, 0.5);
        --bg-1: #86a97c; --bg-2: #58916f; --bg-3: #bdb264;
      }
      :root[data-theme="olive-light"] {
        --page-ink: #20200c;
        --glow-a: rgba(240, 240, 150, 0.5); --glow-b: rgba(170, 190, 90, 0.5);
        --bg-1: #cdc96e; --bg-2: #aaa352; --bg-3: #dcba68;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background:
          radial-gradient(circle at 18% 12%, var(--glow-a) 0%, transparent 34%),
          radial-gradient(circle at 82% 88%, var(--glow-b) 0%, transparent 38%),
          linear-gradient(140deg, var(--bg-1) 0%, var(--bg-2) 52%, var(--bg-3) 100%);
        background-attachment: fixed;
        font-family: "Source Code Pro", monospace;
        display: grid;
        place-items: center;
        padding: 76px 24px 24px; /* top band is reserved for the Atlas button */
      }

      .window {
        position: relative;
        width: min(920px, 100%);
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--window-border);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
        animation: bounceIn 0.9s ease-in-out;
      }

      .handle {
        height: 34px;
        background: linear-gradient(0deg, rgb(216, 216, 216), rgb(236, 236, 236));
        border-top: 1px solid white;
        border-bottom: 1px solid var(--window-border);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(0, 0, 0, 0.7);
        font-size: 13px;
      }

      .theme-btn {
        position: absolute;
        right: 6px;
        top: 2px;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        touch-action: manipulation;
      }

      .theme-menu {
        position: absolute;
        top: 38px;
        right: 6px;
        z-index: 10;
        display: flex;
        gap: 4px;
        padding: 6px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      }

      .theme-menu[hidden] {
        display: none;
      }

      .swatch {
        display: block;
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        /* ring drawn as an inset shadow: a real border made the two-tone gradient tile into the border area and miss the circle's edge */
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        touch-action: manipulation;
      }

      .theme-btn .swatch {
        margin: auto;
        width: 22px;
        height: 22px;
      }

      .swatch[aria-checked="true"] {
        outline: 2px solid #1a120e;
        outline-offset: 1px;
      }

      .theme-btn:focus-visible,
      .swatch:focus-visible {
        outline: 3px solid #1a120e;
        outline-offset: 2px;
      }

      @media (max-width: 420px) {
        .theme-menu {
          gap: 2px;
          padding: 4px;
        }

        .swatch {
          width: 28px;
          height: 28px;
        }

        .theme-btn .swatch {
          width: 22px;
          height: 22px;
        }
      }

      .buttons {
        position: absolute;
        left: 10px;
        display: flex;
        gap: 8px;
      }

      .window-button {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.2);
      }

      .window-button.close {
        background: var(--button-close);
      }

      .window-button.minimize {
        background: var(--button-minimize);
      }

      .window-button.maximize {
        background: var(--button-maximize);
      }

      .terminal {
        background: var(--terminal-bg);
        color: var(--text);
        min-height: 320px;
        max-height: 56vh;
        overflow: auto;
        padding: 12px;
        font-size: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .line {
        margin: 0;
      }

      .terminal a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .terminal a:visited {
        color: var(--visited);
      }

      .terminal a:hover,
      .terminal a:focus-visible {
        color: #ffffff;
      }

      .prompt {
        color: var(--prompt);
      }

      .path {
        color: var(--path);
      }

      .input-row {
        background: var(--terminal-bg);
        padding: 0 12px 12px;
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 0;
      }

      #cmd {
        flex: 1;
        background: transparent;
        color: var(--text);
        border: 1px solid var(--accent-line);
        border-radius: 6px;
        font: inherit;
        font-size: 16px; /* >=16px stops iOS Safari auto-zoom on focus */
        padding: 8px 10px;
        min-width: 0;
        -webkit-appearance: none;
        appearance: none;
        border-radius: 6px;
      }

      .send {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--accent-line);
        border-radius: 6px;
        font: inherit;
        font-size: 16px;
        padding: 8px 12px;
        cursor: pointer;
        touch-action: manipulation;
      }

      #cmd:focus {
        border-color: var(--accent);
      }

      .table-tools {
        margin-top: 0;
        padding: 0 12px 12px;
        background: var(--terminal-bg);
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        color: var(--text-dim);
        font-size: 12px;
      }

      .table-tools label {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .table-tools select,
      .table-tools button {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--accent-line);
        border-radius: 6px;
        font: inherit;
        padding: 4px 8px;
      }

      .table-tools button[hidden] {
        display: none;
      }

      .table-tools button[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .pager-info {
        min-width: 90px;
        color: var(--text-dim);
      }

      .table-wrap {
        margin-top: 0;
        background: var(--table-bg);
        border: 1px solid var(--accent-line);
        border-radius: 8px;
        overflow-x: auto;
        overflow-y: auto;
        color: var(--text);
      }

      table {
        width: max-content;
        min-width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        table-layout: fixed;
      }

      th,
      td {
        border-bottom: 1px solid rgba(var(--accent-rgb), 0.2);
        border-right: 1px solid rgba(var(--accent-rgb), 0.12);
        padding: 10px;
        text-align: left;
        vertical-align: middle;
        height: 44px;
        min-height: 44px;
        max-height: 44px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      th {
        color: var(--th-text);
        background: var(--th-bg);
        position: sticky;
        top: 0;
        font-weight: 500;
        position: sticky;
      }

      th .th-label {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        padding-right: 12px;
      }

      .col-resizer {
        position: absolute;
        top: 0;
        right: 0;
        width: 8px;
        height: 100%;
        cursor: col-resize;
      }

      .col-resizer::after {
        content: "";
        position: absolute;
        top: 8px;
        bottom: 8px;
        right: 3px;
        width: 2px;
        background: rgba(var(--accent-rgb), 0.45);
      }

      .col-resizer:hover::after {
        background: rgba(var(--accent-rgb), 0.9);
      }

      td {
        color: var(--text);
        background: var(--cell-a);
      }

      tbody tr:nth-child(even) td {
        background: var(--cell-b);
      }

      @media (max-width: 700px) {
        body {
          padding: 74px 10px 10px;
        }

        .terminal {
          min-height: 240px;
        }
      }

      /* Atlas link: a filled amber button that is always labelled, with a 44px+ tap target. It sits top right on
         desktop and as a full-width bar along the top on phones. The x dismisses it to a small dot. */
      .atlas-pill {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 20;
        display: flex;
        align-items: stretch;
        min-height: 46px;
        border-radius: 23px;
        overflow: hidden;
        background: linear-gradient(135deg, var(--accent-hi) 0%, var(--accent-lo) 100%);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.45) inset;
        color: var(--on-accent);
        font-size: 15px;
        font-weight: 500;
        white-space: nowrap;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .atlas-pill:hover,
      .atlas-pill:focus-within {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      }

      .atlas-pill a {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1 1 auto;
        padding: 0 8px 0 18px;
        color: inherit;
        text-decoration: none;
        touch-action: manipulation;
      }

      .atlas-pill a:focus-visible,
      .atlas-pill button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: -4px;
        border-radius: 23px;
      }

      .atlas-pill .arrow {
        font-size: 20px;
        padding-right: 6px;
      }

      .atlas-pill .glyph {
        font-size: 18px;
      }

      .atlas-pill .label small {
        display: block;
        font-size: 11px;
        font-weight: 300;
        opacity: 0.8;
        line-height: 1.1;
      }

      .atlas-pill button {
        flex: 0 0 auto;
        min-width: 46px;
        background: rgba(0, 0, 0, 0.12);
        border: 0;
        color: rgba(0, 0, 0, 0.7);
        font: inherit;
        font-size: 20px;
        cursor: pointer;
        touch-action: manipulation;
      }

      .atlas-pill button:hover {
        background: rgba(0, 0, 0, 0.25);
        color: var(--on-accent);
      }

      .atlas-pill[hidden] {
        display: none;
      }

      .atlas-dot {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 20;
        width: 24px;
        height: 24px;
        padding: 0;
        border-radius: 50%;
        border: 2px solid var(--accent-hi);
        background: var(--accent-lo);
        box-shadow: 0 0 0 10px transparent; /* grows the tap target to 44px without growing the dot */
        cursor: pointer;
      }

      .atlas-dot:hover,
      .atlas-dot:focus-visible {
        background: var(--accent-hi);
      }

      .atlas-dot[hidden] {
        display: none;
      }

      @media (max-width: 600px) {
        .atlas-pill {
          top: 8px;
          left: 8px;
          right: 8px;
          min-height: 52px;
          border-radius: 26px;
        }

        .atlas-pill a {
          min-width: 0;
          padding-left: 18px;
          font-size: 14px;
        }

        .atlas-pill .label {
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .atlas-pill .glyph {
          display: none;
        }

        .atlas-pill .label small {
          display: none;
        }

        .atlas-pill .arrow {
          padding-right: 2px;
        }

        .atlas-dot {
          top: 12px;
          right: 12px;
        }
      }

      @keyframes bounceIn {
        0% {
          transform: translateY(-600px);
          opacity: 0;
        }
        60% {
          transform: translateY(30px);
          opacity: 1;
        }
        100% {
          transform: translateY(0);
        }
      }
      .legal-links { position: fixed; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 11px; opacity: 0.75; color: var(--page-ink); }
      .legal-links a { color: inherit; margin: 0 0.4rem; }
    </style>
    <script>
      // Pick a palette before first paint: ?theme=name if given, otherwise a random one. [name, page tone, accent] drive the swatch menu.
      const THEMES = [
        ["dusk", "#4a2f3a", "#ffc46b"], ["forest", "#214636", "#e6c36a"], ["olive", "#4d4a22", "#d6e36a"],
        ["plum", "#55264a", "#f6b49a"], ["graphite", "#2c3331", "#7fe0b0"],
        ["forest-light", "#86a97c", "#e6c36a"], ["olive-light", "#cdc96e", "#d6e36a"],
      ];
      function applyTheme(name) {
        if (name === "dusk") delete document.documentElement.dataset.theme;
        else document.documentElement.dataset.theme = name;
      }
      (function () {
        let t = null;
        try { t = new URLSearchParams(location.search).get("theme"); } catch {}
        if (!THEMES.some((x) => x[0] === t)) t = THEMES[Math.floor(Math.random() * THEMES.length)][0];
        window.currentTheme = t;
        applyTheme(t);
      })();
    </script>

        <button type="button" class="theme-btn" id="themeBtn" aria-label="Colour theme" aria-haspopup="true" aria-expanded="false"><span class="swatch" id="themeCurrent"></span></button>
      </div>
      <div class="theme-menu" id="themeMenu" role="radiogroup" aria-label="Colour theme" hidden></div>

      <section class="terminal" id="terminal" aria-live="polite"></section>

      <form class="input-row" id="cmdForm" autocomplete="off" novalidate>
        <label for="cmd" class="prompt">$</label>
        <input
          id="cmd"
          name="cmd"
          type="text"

           placeholder="Try /whois or /random"
          aria-label="Terminal command"
        />
        <button type="submit" id="cmdSend" class="send" aria-label="Run command">&#9166;</button>
      </form>

      <section class="table-wrap" id="tableWrap" hidden>
        <table id="resultTable"></table>
      </section>

      <section class="table-tools" id="tableTools" hidden>
        <label>
          <input id="paginationToggle" type="checkbox" />
          Pagination
        </label>
        <label>
          Page size
          <select id="pageSize">
            <option value="10">10</option>
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
        <button id="prevPage" type="button">Prev</button>
        <button id="nextPage" type="button">Next</button>
        <span class="pager-info" id="pageIndicator">All rows</span>
        <button id="downloadCsv" type="button" hidden>Download CSV</button>
      </section>
    </main>

    <div class="atlas-pill" id="atlasPill">
      <a href="/atlas/">
        <span class="glyph" aria-hidden="true">&#9673;</span>
        <span class="label">Explore the Atlas of Objectivism<small>Interactive 3D map of organizations and people</small></span>
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>
      <button type="button" id="atlasHide" aria-label="Hide the Atlas link" title="Hide">&times;</button>
    </div>
    <button type="button" class="atlas-dot" id="atlasDot" aria-label="Show the Atlas of Objectivism link" title="Atlas of Objectivism" hidden></button>

    <nav class="legal-links" aria-label="Legal"><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/ai-disclosure">AI disclosure</a><a href="/network">Network</a></nav>

    <aside class="build-meta" aria-hidden="true">
      <span class="label" id="buildCommit">c loading</span>
      <span class="label" id="buildTime">t loading</span>
    </aside>

    <script>
      const terminal = document.getElementById("terminal");
      const cmdInput = document.getElementById("cmd");
      const cmdForm = document.getElementById("cmdForm");
      const cmdSend = document.getElementById("cmdSend");
      const tableTools = document.getElementById("tableTools");
      const tableWrap = document.getElementById("tableWrap");
      const resultTable = document.getElementById("resultTable");
      const paginationToggle = document.getElementById("paginationToggle");
      const pageSizeSelect = document.getElementById("pageSize");
      const prevPageButton = document.getElementById("prevPage");
      const nextPageButton = document.getElementById("nextPage");
      const pageIndicator = document.getElementById("pageIndicator");
      const downloadCsvButton = document.getElementById("downloadCsv");
      const buildCommit = document.getElementById("buildCommit");
      const buildTime = document.getElementById("buildTime");

      const state = {
        unlocked: false,
        password: "",
        awaitingPassword: false,
        awaitingLinks: false,
        ticket: 0,
        pendingSql: "",
        columnWidths: {},
        columns: [],
        rows: [],
        page: 1,
        pageSize: 25,
        paginationEnabled: false,
      };

      const DEFAULT_COLUMN_WIDTH = 180;
      const MIN_COLUMN_WIDTH = 140;
      const ID_FIRST_COLUMN_DEFAULT_WIDTH = 58;
      const ID_FIRST_COLUMN_MIN_WIDTH = 16;
      const PUBLIC_RANDOM_LINKS = [
        { label: "Leonard Peikoff's homepage", href: "https://peikoff.com" },
        { label: "Ason Peikoff's homepage", href: "https://asonpeikoff.com" },
        { label: "Kira Peikoff's homepage", href: "https://kirapeikoff.com" },
        { label: "Barbara Peikoff's homepage", href: "https://barbarapeikoff.com" },
        { label: "Amy Peikoff's 'Don't Let It Go'", href: "https://dontletitgo.com" },
        {
          label: "Amy Peikoff's 'Legalizing Privacy'",
          href: "https://legalizingprivacy.substack.com",
        },
        { label: "Ason's 'Postsocialist Press'", href: "https://posocap.com" },
      ];

      function println(text) {
        const line = document.createElement("p");
        line.className = "line";
        line.textContent = text;
        terminal.appendChild(line);
        terminal.scrollTop = terminal.scrollHeight;
      }

      function printPrompt() {
        println("$ ~ ");
      }

      function setInputMode(mode) {
        cmdInput.type = mode;
      }

      function printLink(label, href, sameTab) {
        const line = document.createElement("p");
        line.className = "line";
        const anchor = document.createElement("a");
        anchor.href = href;
        if (!sameTab) {
          anchor.target = "_blank";
          anchor.rel = "noreferrer noopener";
        }
        anchor.textContent = label;
        line.appendChild(anchor);
        terminal.appendChild(line);
        terminal.scrollTop = terminal.scrollHeight;
      }

      function handlePublicSlashCommand(input) {
        const lower = input.toLowerCase();

        if (lower === "/whois") {
          println("This site was created by Ason Peikoff (asonpeikoff.com).");
          return true;
        }

        if (lower === "/whoare") {
          println("The Peikoffs are a group of unprecedently attractive and intelligent individualists, currently headed by the philosopher Leonard S. Peikoff.");
          return true;
        }
        if (lower === "/random") {
          const randomIndex = Math.floor(Math.random() * PUBLIC_RANDOM_LINKS.length);
          const randomLink = PUBLIC_RANDOM_LINKS[randomIndex];
          println("Random Peikoff: " + randomLink.label);
          printLink(randomLink.label, randomLink.href);
          window.location.assign(randomLink.href);
          return true;
        }

        if (lower === "/links") {
          state.awaitingLinks = true;
          println("Objectivist links or Peikoff links? (type o or p; Ctrl+C to cancel)");
          return true;
        }

        if (lower === "/atlas") {
          println("Opening the Atlas of Objectivism...");
          printLink("Atlas of Objectivism", "/atlas/");
          window.location.assign("/atlas/");
          return true;
        }

        if (lower === "/version") {
          println("Checking the live version...");
          import("/atlas/version.js").then(async (m) => {
            const lines = m.versionLines(await m.loadVersion());
            for (const line of lines) {
              if (line.href) printLink(line.text, line.href); else println(line.text);
            }
          }).catch(() => println("The version is unavailable."));
          return true;
        }

        if (lower === "/data") {
          if (state.unlocked) {
            println("D1 query mode is already unlocked.");
            return true;
          }

          state.awaitingPassword = true;
          state.pendingSql = "";
          setInputMode("password");
          println("Enter password to unlock D1 query mode.");
          return true;
        }

        return false;
      }

      let objectivistLinksCache = null;

      function printLinkList(links) {
        const fragment = document.createDocumentFragment();
        for (const item of links) {
          const line = document.createElement("p");
          line.className = "line";
          const anchor = document.createElement("a");
          anchor.href = item.href;
          anchor.target = "_blank";
          anchor.rel = "noreferrer noopener";
          anchor.textContent = item.label;
          line.appendChild(anchor);
          fragment.appendChild(line);
        }
        terminal.appendChild(fragment);
        terminal.scrollTop = terminal.scrollHeight;
      }

      async function showLinks(choice) {
        if (choice === "peikoff") {
          const sorted = PUBLIC_RANDOM_LINKS.slice().sort((a, b) => a.label.localeCompare(b.label, "en", { sensitivity: "base" }));
          println("Peikoff links (A-Z):");
          printLinkList(sorted);
          return;
        }

        try {
          if (!objectivistLinksCache) {
            const response = await fetch("/links/objectivist.json");
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }
            objectivistLinksCache = await response.json();
          }
          println("Objectivist links (A-Z), " + objectivistLinksCache.length + ":");
          printLinkList(objectivistLinksCache);
        } catch (error) {
          println("Could not load the Objectivist links: " + error.message);
        }
      }

      // Ctrl+C: abandon whatever the prompt is waiting for (D1 password, /links choice), even mid-request.
      function cancelPending() {
        state.ticket += 1;
        state.awaitingPassword = false;
        state.awaitingLinks = false;
        state.pendingSql = "";
        setInputMode("text");
        cmdInput.value = "";
        println("^C");
        printPrompt();
        cmdInput.focus();
      }

      document.addEventListener("keydown", (event) => {
        if (!event.ctrlKey || event.metaKey || event.altKey || String(event.key).toLowerCase() !== "c") {
          return;
        }
        const selected = String(window.getSelection ? window.getSelection() : "");
        let inputSelected = false;
        try {
          inputSelected = cmdInput.selectionStart !== cmdInput.selectionEnd;
        } catch {}
        if (selected || inputSelected) {
          return; // let Ctrl+C copy selected text
        }
        event.preventDefault();
        cancelPending();
      });

      function isFirstIdColumn(columnName, index) {
        return index === 0 && String(columnName).trim().toLowerCase() === "id";
      }

      function getWidthKey(columnName, index) {
        return index + ":" + columnName;
      }

      function getDefaultWidth(columnName, index) {
        return isFirstIdColumn(columnName, index)
          ? ID_FIRST_COLUMN_DEFAULT_WIDTH
          : DEFAULT_COLUMN_WIDTH;
      }

      function getMinWidth(columnName, index) {
        return isFirstIdColumn(columnName, index)
          ? ID_FIRST_COLUMN_MIN_WIDTH
          : MIN_COLUMN_WIDTH;
      }

      function getVisibleRows() {
        if (!state.paginationEnabled) {
          return state.rows;
        }

        const start = (state.page - 1) * state.pageSize;
        return state.rows.slice(start, start + state.pageSize);
      }

      function getPageCount() {
        if (!state.paginationEnabled) {
          return 1;
        }

        return Math.max(1, Math.ceil(state.rows.length / state.pageSize));
      }

      function updateTableTools() {
        const hasData = state.columns.length > 0;
        tableTools.hidden = !hasData;
        if (!hasData) {
          return;
        }

        const pageCount = getPageCount();
        pageIndicator.textContent = state.paginationEnabled
          ? "Page " + state.page + " / " + pageCount
          : "All rows";

        pageSizeSelect.disabled = !state.paginationEnabled;
        prevPageButton.disabled = !state.paginationEnabled || state.page <= 1;
        nextPageButton.disabled = !state.paginationEnabled || state.page >= pageCount;
      }

      function renderTable() {
        const columns = state.columns;
        const rows = getVisibleRows();
        if (!columns.length) {
          tableTools.hidden = true;
          tableWrap.hidden = true;
          resultTable.innerHTML = "";
          return;
        }

        const colgroup = document.createElement("colgroup");
        const cols = [];
        for (let index = 0; index < columns.length; index += 1) {
          const column = columns[index];
          const widthKey = getWidthKey(column, index);
          const col = document.createElement("col");
          const width = Math.max(
            getMinWidth(column, index),
            Number(state.columnWidths[widthKey] || getDefaultWidth(column, index)),
          );
          col.style.width = width + "px";
          colgroup.appendChild(col);
          cols.push(col);
        }

        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        for (let index = 0; index < columns.length; index += 1) {
          const column = columns[index];
          const th = document.createElement("th");
          const label = document.createElement("span");
          label.className = "th-label";
          label.textContent = column;
          th.appendChild(label);

          const resizer = document.createElement("span");
          resizer.className = "col-resizer";
          resizer.setAttribute("aria-hidden", "true");
          attachColumnResize(resizer, cols[index], column, index);
          th.appendChild(resizer);

          headRow.appendChild(th);
        }
        thead.appendChild(headRow);

        const tbody = document.createElement("tbody");
        for (const row of rows) {
          const tr = document.createElement("tr");
          for (const column of columns) {
            const td = document.createElement("td");
            const value = row[column];
            td.textContent = value == null ? "NULL" : String(value);
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }

        resultTable.innerHTML = "";
        resultTable.appendChild(colgroup);
        resultTable.appendChild(thead);
        resultTable.appendChild(tbody);
        tableWrap.hidden = false;
        updateTableTools();
      }

      function attachColumnResize(handle, col, columnName, index) {
        handle.addEventListener("mousedown", (event) => {
          event.preventDefault();

          const startX = event.clientX;
          const startWidth = parseInt(col.style.width, 10) || DEFAULT_COLUMN_WIDTH;
          const minWidth = getMinWidth(columnName, index);
          const widthKey = getWidthKey(columnName, index);

          function onMouseMove(moveEvent) {
            const delta = moveEvent.clientX - startX;
            const width = Math.max(minWidth, startWidth + delta);
            col.style.width = width + "px";
            state.columnWidths[widthKey] = width;
          }

          function onMouseUp() {
            document.removeEventListener("mousemove", onMouseMove);
            document.removeEventListener("mouseup", onMouseUp);
          }

          document.addEventListener("mousemove", onMouseMove);
          document.addEventListener("mouseup", onMouseUp);
        });
      }

      function toCsv(columns, rows) {
        const escape = (value) => {
          if (value == null) {
            return "";
          }

          const text = String(value);
          if (/[",\n]/.test(text)) {
            return '"' + text.replace(/"/g, '""') + '"';
          }

          return text;
        };

        const lines = [];
        lines.push(columns.map(escape).join(","));
        for (const row of rows) {
          lines.push(columns.map((column) => escape(row[column])).join(","));
        }
        return lines.join("\n");
      }

      function downloadCsv() {
        if (!state.columns.length) {
          return;
        }

        const csv = toCsv(state.columns, state.rows);
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const stamp = new Date().toISOString().replace(/[:.]/g, "-");
        a.href = url;
        a.download = "d1-query-" + stamp + ".csv";
        a.click();
        URL.revokeObjectURL(url);
      }

      async function verifyPassword(password) {
        const response = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });

        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          throw new Error(body.error || "Password check failed.");
        }
      }

      async function runQuery(sql) {
        const response = await fetch("/api/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: state.password, sql }),
        });

        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(body.error || "Query failed.");
        }

        return body;
      }

      async function loadVersion() {
        try {
          const response = await fetch("/version.json", { cache: "no-store" });
          if (!response.ok) {
            throw new Error("version request failed");
          }

          const body = await response.json();
          const commit = String(body.commit || "dev");
          const shortCommit = commit === "unknown" ? commit : commit.slice(0, 7);
          buildCommit.textContent = "c " + shortCommit;
          buildTime.textContent = "t " + (body.builtAt || "unknown");
        } catch {
          buildCommit.textContent = "c unavailable";
          buildTime.textContent = "t unavailable";
        }
      }

      // Atlas of Objectivism button: always visible, can be dismissed to a dot (remembered in this browser)
      (function () {
        const pill = document.getElementById("atlasPill");
        const dot = document.getElementById("atlasDot");
        const KEY = "atlasLinkHidden";
        function setHidden(hidden) {
          pill.hidden = hidden;
          dot.hidden = !hidden;
          try { localStorage.setItem(KEY, hidden ? "1" : "0"); } catch {}
        }
        let stored = false;
        try { stored = localStorage.getItem(KEY) === "1"; } catch {}
        setHidden(stored);
        document.getElementById("atlasHide").addEventListener("click", () => setHidden(true));
        dot.addEventListener("click", () => setHidden(false));
      })();

      // Colour-only theme menu in the title bar
      (function () {
        const btn = document.getElementById("themeBtn");
        const menu = document.getElementById("themeMenu");
        const current = document.getElementById("themeCurrent");
        const paint = (el, theme) => { el.style.background = "linear-gradient(135deg, " + theme[1] + " 50%, " + theme[2] + " 50%) border-box"; };
        function sync() {
          const theme = THEMES.find((x) => x[0] === window.currentTheme);
          paint(current, theme);
          for (const b of menu.children) b.setAttribute("aria-checked", String(b.dataset.theme === window.currentTheme));
        }
        for (const theme of THEMES) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "swatch";
          b.dataset.theme = theme[0];
          b.setAttribute("role", "radio");
          b.setAttribute("aria-label", theme[0].replace("-", " "));
          paint(b, theme);
          b.addEventListener("click", () => { window.currentTheme = theme[0]; applyTheme(theme[0]); sync(); setOpen(false); });
          menu.appendChild(b);
        }
        function setOpen(open) {
          menu.hidden = !open;
          btn.setAttribute("aria-expanded", String(open));
        }
        btn.addEventListener("click", (e) => { e.stopPropagation(); setOpen(menu.hidden); });
        document.addEventListener("click", (e) => { if (!menu.hidden && !menu.contains(e.target)) setOpen(false); });
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpen(false); });
        sync();
      })();

      function bootstrap() {
        println("Peikoff.net");
        println("Commands: /whois, /whoare, /random, /links, /atlas, /version");
        printLink("Explore the Atlas of Objectivism \u2192", "/atlas/", true);
        println("");
        const date = new Date().toString();
        println("Last login: " + date + " on ttys000");
        setInputMode("text");
        printPrompt();
        cmdInput.focus();
        loadVersion();
      }

      // Form submit fires for Enter/Go/Send on desktop and iOS virtual keyboards;
      // keydown "Enter" is unreliable on iOS.
      let submitting = false;
      cmdForm.addEventListener("submit", (event) => {
        event.preventDefault();
        runSubmit();
      });
      // Fallbacks: some iOS keyboards skip implicit form submission.
      cmdInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.keyCode === 13) {
          event.preventDefault();
          runSubmit();
        }
      });
      cmdInput.addEventListener("beforeinput", (event) => {
        if (event.inputType === "insertLineBreak") {
          event.preventDefault();
          runSubmit();
        }
      });
      cmdSend.addEventListener("click", (event) => {
        event.preventDefault();
        runSubmit();
        cmdInput.focus();
      });

      async function runSubmit() {
        if (submitting) {
          return;
        }
        submitting = true;
        try {
          await handleSubmit();
        } finally {
          submitting = false;
        }
      }

      async function handleSubmit() {

        const raw = cmdInput.value;
        const input = raw.trim();
        cmdInput.value = "";

        if (!input) {
          printPrompt();
          return;
        }

        if (state.awaitingLinks) {
          println("$ ~ " + input);
          const answer = input.toLowerCase();
          if (answer.startsWith("o") || answer === "1") {
            state.awaitingLinks = false;
            await showLinks("objectivist");
          } else if (answer.startsWith("p") || answer === "2") {
            state.awaitingLinks = false;
            await showLinks("peikoff");
          } else {
            println('Please type "o" for Objectivist links or "p" for Peikoff links (Ctrl+C to cancel).');
          }
          printPrompt();
          return;
        }

        if (state.awaitingPassword) {
          println("$ ~ " + "*".repeat(input.length));
          const ticket = state.ticket;
          try {
            await verifyPassword(input);
            if (ticket !== state.ticket) {
              return; // cancelled with Ctrl+C while the password was being checked
            }
            state.unlocked = true;
            downloadCsvButton.hidden = false;
            state.password = input;
            state.awaitingPassword = false;
            setInputMode("text");
            println("Access granted. You can now run SQLite SELECT statements.");

            const pendingSql = state.pendingSql;
            state.pendingSql = "";
            if (pendingSql) {
              try {
                const result = await runQuery(pendingSql);
                println("Query OK. " + result.rowCount + " row(s).");
                state.columns = result.columns || [];
                state.rows = result.rows || [];
                state.page = 1;
                renderTable();
              } catch (error) {
                println("Error: " + error.message);
              }
            }
          } catch (error) {
            if (ticket !== state.ticket) {
              return;
            }
            state.awaitingPassword = false;
            state.pendingSql = "";
            setInputMode("text");
            println("Access denied: " + error.message);
          }

          printPrompt();
          return;
        }

        if (!state.unlocked && input.startsWith("/")) {
          if (handlePublicSlashCommand(input)) {
            printPrompt();
            return;
          }

          println("Unknown public command: " + input);
          printPrompt();
          return;
        }

        if (!state.unlocked) {
          state.awaitingPassword = true;
          state.pendingSql = input;
          setInputMode("password");
          println("Enter password to unlock D1 query mode.");
          printPrompt();
          return;
        } else {
          println("$ ~ " + input);
        }

        if (input.toLowerCase() === "clear") {
          terminal.innerHTML = "";
          state.columns = [];
          state.rows = [];
          state.page = 1;
          tableWrap.hidden = true;
          tableTools.hidden = true;
          resultTable.innerHTML = "";
          printPrompt();
          return;
        }

        try {
          const result = await runQuery(input);
          println("Query OK. " + result.rowCount + " row(s).");
          state.columns = result.columns || [];
          state.rows = result.rows || [];
          state.page = 1;
          renderTable();
        } catch (error) {
          println("Error: " + error.message);
        }

        printPrompt();
      }

      paginationToggle.addEventListener("change", () => {
        state.paginationEnabled = paginationToggle.checked;
        state.page = 1;
        renderTable();
      });

      pageSizeSelect.addEventListener("change", () => {
        const parsed = Number(pageSizeSelect.value);
        state.pageSize = Number.isFinite(parsed) && parsed > 0 ? parsed : 25;
        state.page = 1;
        renderTable();
      });

      prevPageButton.addEventListener("click", () => {
        if (state.page > 1) {
          state.page -= 1;
          renderTable();
        }
      });

      nextPageButton.addEventListener("click", () => {
        const pageCount = getPageCount();
        if (state.page < pageCount) {
          state.page += 1;
          renderTable();
        }
      });

      downloadCsvButton.addEventListener("click", downloadCsv);

      bootstrap();
    </script>

  </body>
</html>
