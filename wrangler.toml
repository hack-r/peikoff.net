name = "peikoff-net"
main = "src/index.js"
compatibility_date = "2026-10-04"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[[d1_databases]]
binding = "whoneedsit"
database_name = "whoneedsit"
database_id = "82c55bae-2ae2-4502-bd8e-1a790ba981c4"

# Required by Worker Previews (non-production branch builds). Previews do not
# inherit production bindings, so the D1 binding is repeated here. This points
# at the production database; swap in a staging database_id to isolate previews.
[previews]

[[previews.d1_databases]]
binding = "whoneedsit"
database_name = "whoneedsit"
database_id = "82c55bae-2ae2-4502-bd8e-1a790ba981c4"
